plugin:
  name: custom-vzg-validationhub
  url: https://github.com/programmfabrik/fylr-plugin-custom-vzg-validationhub
  version: 0.7
  l10n: l10n/custom-vzg-validationhub.csv
  displayname:
    de-DE: VZG-Validierungszentrale
    en-US: VZG-Validationhub
  info:
    de-DE: "Sendet Informationen an den zentralen Validierungsdienst der VZG."
    en-US: "Sends information to the central validationhub of the VZG."
  webfrontend:
    url: custom-vzg-validationhub.js

base_url_prefix: "webfrontend"

callbacks:
  transition_db_pre_save:
    sendtovalidation:
      exec:
        service: "node"
        commands:
          - prog: "node"
            stdin:
              type: body
            stdout:
              type: body
            args:
              - type: "value"
                value: "%_exec.pluginDir%/server/validation.js"

  db_pre_save:
    steps:
      - name: "test for 'validierungstest'"
        callback: sendtovalidation
    callbacks:
      sendtovalidation:
        exec:
          service: "node"
          commands:
            - prog: "node"
              stdin:
                type: body
              stdout:
                type: body
              args:
                - type: "value"
                  value: "%_exec.pluginDir%/server/validation.js"
                - type: "value"
                  value: "%info.json%"

base_config:
  - name: VZG-Validationhub
    group: validationhub
    parameters:
      enable_validation:
        type: bool
        position: 1
      skip_validation_users:
        type: table
        position: 2
        fields:
          - name: skip_validation_user
            type: user
      enable_debugging:
        type: bool
        position: 3
      instance_url:
        type: text
        position: 4
      token:
        type: text
        position: 5
      timeout:
        type: int
        position: 6
      resolve_on_timeout:
        type: bool
        position: 7
      send_l10n:
        type: bool
        position: 8
      max_records_to_check_on_error:
        type: int
        position: 9
      tagfilter_select:
        type: tagfilter-select
        position: 10
      validation_selector:
        type: text
        plugin_type: validation-selector
        store_as_json: true
        position: 11
